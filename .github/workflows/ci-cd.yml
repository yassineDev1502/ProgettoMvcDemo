name: .NET Core CI-CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Verifica e Deploy su Azure
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configurazione ambiente .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Ripristino pacchetti (Restore)
      run: dotnet restore ProgettoMvcDemo.sln

    - name: Compilazione e creazione pacchetto (.NET Publish)
      run: dotnet publish ProgettoMvcDemo.sln --configuration Release --output ${{ github.workspace }}/output_package

    - name: Deploy su Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'api-dotnet-uni-yassine'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ github.workspace }}/output_package
