name: .NET Core CI-CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Verifica e Deploy su Azure
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configurazione ambiente .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Forza l'Agent ad entrare nella sottocartella dove c'è il vero codice
    - name: Ripristino pacchetti (Restore)
      working-directory: ./ProgettoMvcDemo
      run: dotnet restore

    # Forza la compilazione nella sottocartella e sposta l'output all'esterno
    - name: Compilazione e creazione pacchetto (.NET Publish)
      working-directory: ./ProgettoMvcDemo
      run: dotnet publish -c Release -o ${{ github.workspace }}/myapp

    # Ora l'Agent troverà la cartella 'myapp' al 100%
    - name: Deploy su Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'api-dotnet-uni-yassine'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: '${{ github.workspace }}/myapp'
